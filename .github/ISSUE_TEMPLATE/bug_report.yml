name: Bug report
description: Ledger semantics, the write gate, draft validation, CLI or MCP behaves unexpectedly
title: "[bug] "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimal reproduction. **Do not paste real statements or account numbers** — use equivalent fake data.
  - type: input
    id: version
    attributes:
      label: beancount-guard version
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How you use it
      options:
        - CLI
        - MCP tools
        - Python library
        - Indirectly through the dsh-ledger plugin
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest .bean snippet or draft JSON that triggers the problem
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Error code, message, or the ledger diff after writing
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
