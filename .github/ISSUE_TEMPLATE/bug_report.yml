name: 缺陷报告
description: 账本语义、写入门禁、草稿校验、CLI 或 MCP 行为不符合预期
title: "[bug] "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        请提供可复现的最小输入。**不要贴真实账单与账号**，用等价的假数据即可。
  - type: input
    id: version
    attributes:
      label: beancount-guard 版本
      placeholder: 例如 0.1.2
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 使用方式
      options:
        - CLI
        - MCP 工具
        - Python 库
        - 由 dsh-ledger 插件间接调用
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 最小输入
      description: 触发问题的最小 .bean 片段或草稿 JSON
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 错误码、报错信息或写入后的账本差异
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
