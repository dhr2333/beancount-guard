name: 功能请求
description: 希望核心库支持的账本语义或写入能力
title: "[feat] "
labels: ["type:feat"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 哪类账本操作现在做不到，或只能手工完成
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望结果
      placeholder: 描述语义与错误码层面的期望，不必设计实现
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 该能力不要求绕过 bean-check 或 balance 断言
          required: true
        - label: 该能力不要求核心直接解析账单文件（解析留在 Agent 侧）
          required: true
