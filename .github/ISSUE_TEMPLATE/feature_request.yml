name: Feature request
description: Ledger semantics or write capabilities you want the core to support
title: "[feat] "
labels: ["type:feat"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: Which ledger operation is impossible today, or only doable by hand
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected result
      placeholder: Describe the expected semantics and error codes; implementation design is not required
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary check
      options:
        - label: This does not bypass bean-check or balance assertions
          required: true
        - label: This does not ask the core to parse bank statements (parsing stays on the Agent side)
          required: true
