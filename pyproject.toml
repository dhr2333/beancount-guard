[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-domain"
version = "0.1.0"
description = "Thin Beancount ledger core: alias metadata, reconciliation periods, reviewed drafts, validated atomic writes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3", "beanquery>=0.2"]

[project.scripts]
ledger-domain = "ledger_domain.cli:main"

[tool.setuptools.packages.find]
include = ["ledger_domain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
