[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beancount-guard"
version = "0.1.0"
description = "Write guard and reconciliation core for Beancount ledgers: alias metadata, periods, reviewed drafts, validated atomic writes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3", "beanquery>=0.2"]

[project.scripts]
beancount-guard = "beancount_guard.cli:main"

[tool.setuptools.packages.find]
include = ["beancount_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
